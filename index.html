<script>
/* ================= DATA ================= */
const DATA = window.__PROMPTS_DATA__ || { site:{}, prompts:[] };
const TG = (DATA.site.tg_username || '').trim();
const PROMPTS = DATA.prompts || [];

document.title = DATA.site.title || 'RP Prompt Hub';
document.getElementById('siteTitle').textContent = DATA.site.title || 'RP Prompt Hub';
document.getElementById('siteSubtitle').textContent = DATA.site.subtitle || '';
document.getElementById('count').textContent = PROMPTS.length + ' промптов';

/* ================= UTIL ================= */
function tgLink(text){
  const base = TG ? 'https://t.me/' + TG : 'https://t.me/';
  return base + '?text=' + encodeURIComponent(text);
}
function setFbButtons(){
  ['fbBtn','fbBtn2'].forEach(id=>{
    const b=document.getElementById(id);
    b.onclick=()=>openUrl(tgLink('Привет! По поводу RP Prompt Hub: '));
  });
}
function openUrl(u){ window.open(u,'_blank'); }
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

/* ================= PROMPT VARIABLES ================= */
const DEF = { lang:'English', min:30, max:90 };
let cfg = Object.assign({}, DEF);
function loadCfg(){
  try{
    const raw=localStorage.getItem('rp_hub_cfg');
    if(raw) cfg=Object.assign({}, DEF, JSON.parse(raw));
  }catch(e){}
  document.getElementById('cfgLang').value=cfg.lang;
  document.getElementById('cfgMin').value=cfg.min;
  document.getElementById('cfgMax').value=cfg.max;
  document.getElementById('settingsHint').textContent=
    '{{lang}} → '+cfg.lang+' · {{min}}–{{max}} → '+cfg.min+'–'+cfg.max;
}
function saveCfg(){
  try{ localStorage.setItem('rp_hub_cfg', JSON.stringify(cfg)); }catch(e){}
  document.getElementById('settingsHint').textContent=
    '{{lang}} → '+cfg.lang+' · {{min}}–{{max}} → '+cfg.min+'–'+cfg.max;
}
function fillVars(t){
  if(!t) return t;
  return t.replace(/\{\{lang\}\}/g, cfg.lang)
          .replace(/\{\{min\}\}/g, cfg.min)
          .replace(/\{\{max\}\}/g, cfg.max);
}
document.getElementById('cfgLang').addEventListener('change',e=>{
  cfg.lang=e.target.value; saveCfg(); render();
});
document.getElementById('cfgMin').addEventListener('change',e=>{
  let v=parseInt(e.target.value,10);
  if(isNaN(v)||v<1) v=DEF.min;
  if(v>=(parseInt(document.getElementById('cfgMax').value,10)||DEF.max)) v=DEF.min;
  cfg.min=v; e.target.value=v; saveCfg(); render();
});
document.getElementById('cfgMax').addEventListener('change',e=>{
  let v=parseInt(e.target.value,10);
  if(isNaN(v)||v<1) v=DEF.max;
  if(v<=(parseInt(document.getElementById('cfgMin').value,10)||DEF.min)) v=DEF.max;
  cfg.max=v; e.target.value=v; saveCfg(); render();
});
function fmtDate(iso){
  if(!iso) return '';
  const d=new Date(iso);
  const p=n=>String(n).padStart(2,'0');
  return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function shortHash(h){ return h ? h.slice(0,8) : ''; }

/* ================= CLIPBOARD ================= */
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  try{
    const ta=document.createElement('textarea');
    ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok=document.execCommand('copy'); ta.remove(); return ok;
  }catch(e){ return false; }
}
let toastTimer=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
}
function flashCopy(btn, label){
  if(!btn) return;
  const old=btn.textContent;
  btn.textContent='✓ Готово';
  btn.classList.add('copied');
  setTimeout(()=>{ btn.textContent=old; btn.classList.remove('copied'); },1600);
}

/* ================= MODEL CHIPS ================= */
const MODEL_COLORS = {
  'claude':'#f59e0b','gemini':'#60a5fa','grok':'#34d399','qwen':'#a78bfa',
  'kimi':'#f472b6','glm':'#f87171','deepseek':'#38bdf8','mimo':'#22d3ee',
  'universal':'#94a3b8'
};
function modelColor(m){
  const k=m.toLowerCase();
  for(const key in MODEL_COLORS){ if(k.includes(key)) return MODEL_COLORS[key]; }
  return '#94a3b8';
}

/* ================= STATE & RENDER ================= */
const state = { q:'', model:'', kind:'all' };
const MODELS = [...new Set(PROMPTS.flatMap(p=>p.models||[]))].sort();

function buildModelChips(){
  const wrap=document.getElementById('modelChips');
  wrap.innerHTML='';
  const all=document.createElement('button');
  all.className='chip'+(state.model===''?' on':''); all.textContent='Все модели';
  all.onclick=()=>{ state.model=''; renderChips(); render(); };
  wrap.appendChild(all);
  MODELS.forEach(m=>{
    const c=document.createElement('button');
    c.className='chip'+(state.model===m?' on':'');
    c.style.cssText='--mc:'+modelColor(m);
    c.innerHTML='<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mc);margin-right:6px"></span>'+esc(m);
    c.onclick=()=>{ state.model=(state.model===m?'':m); renderChips(); render(); };
    wrap.appendChild(c);
  });
}
function renderChips(){
  [...document.querySelectorAll('#modelChips .chip')].forEach(c=>{
    c.classList.toggle('on', c.textContent.includes(state.model) && state.model!=='');
  });
  [...document.querySelectorAll('#kindSeg .chip')].forEach(c=>{
    c.classList.toggle('on', c.dataset.kind===state.kind);
  });
}
function matches(p){
  const q=state.q.toLowerCase();
  if(state.model && !(p.models||[]).some(m=>m.toLowerCase().includes(state.model.toLowerCase()))) return false;
  if(state.kind==='jb' && !p.jb) return false;
  if(state.kind==='craft' && p.jb) return false;
  if(!q) return true;
  const hay=(p.title+' '+(p.file||'')+' '+(p.description||'')+' '+(p.models||[]).join(' ')+' '+(p.tags||[]).join(' ')+' '+(p.content||'').slice(0,1500)).toLowerCase();
  return hay.includes(q);
}

function cardHtml(p){
  const models=(p.models||[]).map(m=>'<span class="tag model" style="background:'+modelColor(m)+'">'+esc(m)+'</span>').join('');
  const tags=(p.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join('');
  const jbBadge=p.jb?'<button class="btn badge-jb" style="padding:2px 8px;font-size:10.5px;cursor:default">свобода</button>'
                     :'<button class="btn badge-craft" style="padding:2px 8px;font-size:10.5px;cursor:default">стандарт</button>';
  const prev=fillVars(p.content||'').replace(/\s+/g,' ').trim().slice(0,240);
  const ver=p.versionCount||0;
  const updBadge=p.updated?'<span class="badge-upd">🕓 '+fmtDate(p.updated)+'</span>':'';
  const updv=ver?' · '+ver+' верс.':' · без истории';
  return ''+
  '<div class="card" data-name="'+esc(p.file)+'">'+
    '<div class="card-head">'+
      '<div>'+
        '<div class="card-title">'+esc(p.title||p.file)+'</div>'+
        '<div class="card-file">'+esc(p.file)+'</div>'+
      '</div>'+jbBadge+
    '</div>'+
    '<div class="card-tags">'+models+tags+'</div>'+
    (p.description?'<div class="card-desc">'+esc(p.description)+'</div>':'')+
    (prev?'<div class="preview">'+esc(prev)+'…</div>':'')+
    '<div class="card-foot">'+
      '<div class="meta">'+updBadge+'<span>'+updv+'</span></div>'+
      '<div class="card-actions">'+
        '<button class="btn primary" data-act="copy">⧉ Копировать</button>'+
        '<button class="btn ghost" data-act="hist">История</button>'+
      '</div>'+
    '</div>'+
  '</div>';
}
function render(){
  const grid=document.getElementById('grid');
  let list=[];
  if(!PROMPTS.length){
    grid.innerHTML='<div class="empty">Пока пусто — коллекция наполняется, загляни позже</div>';
  }else{
    list=PROMPTS.filter(matches);
    grid.innerHTML=list.length?list.map(cardHtml).join('')
      :'<div class="empty">Ничего не нашлось. Смени фильтр или поиск.</div>';
  }
  document.getElementById('footCount').textContent=PROMPTS.length?(list.length+' / '+PROMPTS.length):'0';
}

/* ================= EVENTS: GRID ================= */
document.getElementById('grid').addEventListener('click', async e=>{
  const btn=e.target.closest('[data-act]');
  const card=e.target.closest('.card');
  if(!card) return;
  const name=card.dataset.name;
  const p=PROMPTS.find(x=>x.file===name);
  if(!p) return;
  if(btn){
    if(btn.dataset.act==='copy'){
      const ok=await copyText(fillVars(p.content||''));
      toast(ok?'✓ Скопировано в буфер':'⚠ Не удалось скопировать');
      flashCopy(btn);
    }else if(btn.dataset.act==='hist'){
      openModal(p,'hist');
    }
    return;
  }
  openModal(p,'text');
});
document.getElementById('q').addEventListener('input',e=>{ state.q=e.target.value; render(); });
document.getElementById('kindSeg').addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  state.kind=c.dataset.kind; renderChips(); render();
});

/* ================= MODAL ================= */
let cur=null, curVersion=null, diffOn=false;
const overlay=document.getElementById('overlay');

function openModal(p, tab){
  cur=p; curVersion=null; diffOn=false;
  document.getElementById('mTitle').textContent=p.title||p.file;
  document.getElementById('mFile').textContent=p.file;
  document.getElementById('mVer').textContent='текущая версия'+(p.updated?' · '+fmtDate(p.updated):'');
  document.getElementById('mText').textContent=fillVars(p.content||'(пусто)');
  document.getElementById('mDiff').style.display='none';
  const fb=document.getElementById('mFb');
  fb.onclick=()=>openUrl(tgLink('Привет! Пишу по поводу промпта «'+(p.title||p.file)+'» ('+p.file+'): '));
  buildHist(p);
  switchTab(tab==='hist'?'hist':'text');
  overlay.classList.add('open');
}
function buildHist(p){
  const wrap=document.getElementById('mHist');
  const vs=p.versions||[];
  wrap.innerHTML='';
  if(!vs.length){
    wrap.innerHTML='<div class="empty">История пуста — версии считаются с момента сброса. Они появятся после следующих правок промпта.</div>';
    return;
  }
  document.getElementById('histTab').textContent='История версий ('+vs.length+')';
  vs.forEach((v,i)=>{
    const el=document.createElement('div');
    el.className='hitem'+(i===0?' on':'');
    el.innerHTML=
      '<div class="hitem-top">'+
        '<span class="hitem-hash">'+shortHash(v.hash)+'</span>'+
        '<span class="hitem-date">'+fmtDate(v.date)+'</span>'+
        (i===0?'<span class="pill">текущая</span>':'')+
      '</div>'+
      '<div class="hitem-msg">'+esc(v.message||'')+'</div>';
    el.onclick=()=>{
      if(v.content==null){
        toast('⚠ Контент этой версии недоступен');
        return;
      }
      curVersion=i;
      diffOn=false;
      document.getElementById('mDiff').style.display=i>0?'inline-flex':'none';
      document.getElementById('mVer').textContent='версия '+shortHash(v.hash)+' · '+fmtDate(v.date);
      document.getElementById('mText').textContent=fillVars(v.content||'');
      wrap.querySelectorAll('.hitem').forEach(x=>x.classList.remove('on'));
      el.classList.add('on');
    };
    wrap.appendChild(el);
  });
}
function switchTab(t){
  document.querySelectorAll('.modal-tabs .tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===t));

  document.getElementById('mTextWrap').style.display=isText?'block':'none';
  document.getElementById('mHist').style.display=isText?'none':'flex';

}
document.querySelectorAll('.modal-tabs .tab').forEach(t=>{

/* ================= DIFF ================= */
function diffLines(a,b){
  const A=(a||'').split('\n'), B=(b||'').split('\n');
  const m=A.length,n=B.length;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)
    dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[];let i=0,j=0;
  while(i<m&&j<n){
    if(A[i]===B[j]){out.push({t:' ',x:A[i]});i++;j++;}
    else if(dp[i+1][j]>=dp[i][j+1]){out.push({t:'-',x:A[i]});i++;}
    else{out.push({t:'+',x:B[j]});j++;}
  }
  while(i<m){out.push({t:'-',x:A[i]});i++;}
  while(j<n){out.push({t:'+',x:B[j]});j++;}
  return out;
}
document.getElementById('mDiff').addEventListener('click',function(){
  if(!cur||curVersion===null||curVersion<1) return;
  diffOn=!diffOn;
  this.textContent=diffOn?'Показать текст':'Дифф с предыдущей';
  if(!diffOn){
    document.getElementById('mText').textContent=cur.versions[curVersion].content;
    return;
  }
  const old=fillVars(cur.versions[curVersion-1].content||'');
  const neu=fillVars(cur.versions[curVersion].content||'');
  const lines=diffLines(old,neu);
  const pre=document.createElement('pre');
  pre.className='diff';
  lines.forEach(l=>{
    const span=document.createElement('div');
    if(l.t==='+'){span.className='add';span.textContent='+ '+l.x;}
    else if(l.t==='-'){span.className='del';span.textContent='- '+l.x;}
    else{span.textContent='  '+l.x;}
    pre.appendChild(span);
  });
  const wrap=document.getElementById('mTextWrap');
  wrap.innerHTML=''; wrap.appendChild(pre);
});

<script>
/* ================= VISIT COUNTER ================= */
/* Isolated in its own script so an error elsewhere can't kill it.
   One increment per browser per hour (localStorage throttle) so refreshes
   don't inflate the count. The timestamp is written only when the badge
   actually loads — a transient failure doesn't burn the slot. Invisible on
   failure. Backend: hits.dwyl.com badge (free, no signup, Cloudflare+fly.io).
   referrerpolicy no-referrer: don't leak this page's URL to the service. */
(function(){
  try{
    const KEY='rp_hub_hit_ts_v2', HOUR=3600000;
    const box=document.getElementById('visits');
    const img=document.getElementById('visitsImg');
    if(!box||!img) return;
    const last=parseInt(localStorage.getItem(KEY)||'0',10);
    if(Date.now()-last<HOUR) return;
    img.onload=function(){
      try{ localStorage.setItem(KEY,String(Date.now())); }catch(e){}
      box.style.display='';
    };
    img.onerror=function(){ box.style.display='none'; };
    img.referrerPolicy='no-referrer';
    img.src='https://hits.dwyl.com/TheWorldMachine/rp-prompt-hub-community.svg';
  }catch(e){}
})();
</script>
